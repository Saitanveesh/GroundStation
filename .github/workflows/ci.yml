name: HROT AirTrust CI
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Python syntax
        run: python -m py_compile server.py tools/demo_signer.py
      - name: Browser JavaScript syntax
        run: node --check web/app.js
      - name: Cryptography, policy, audit and API tests
        run: pytest -v tests/
